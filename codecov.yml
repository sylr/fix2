---
coverage:
  status:
    # Reported on pull requests, without failing them.
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
ignore:
  # The contribs, binancefix, binancemd, coinbasemd and the others: built
  # on the library, not part of it.
  - "contribs"
  # Packages fix2gen generates for tests.
  - "fix/tests"
  # Test helpers.
  - "fix/internal/dicttest"
  - "fix/session/store/storetest"
