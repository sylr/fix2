---
name: Go
on:
  push:
  pull_request:
  schedule:
    # Every night the fuzzers run longer, from the corpus grown so far.
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time to fuzz each target for
        default: 1m
permissions:
  contents: read
# A new commit on a branch, or a pull request, cancels its runs still going.
# Per event: a push does not cancel the nightly fuzzing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test (${{ matrix.os }}${{ matrix.simd && ', simd' || '' }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # Codecov's upload, authenticated with OIDC
    strategy:
      fail-fast: false
      matrix:
        # amd64 and arm64; darwin, which has its own hrtimer in assembly,
        # on arm64: macos-26 runs the macOS 26 arm64 image.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
        simd: [false, true]
    env:
      GOEXPERIMENT: ${{ matrix.simd && 'simd' || '' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: |
            go.sum
            contribs/*/go.sum
            contribs/*/*/go.sum

      - name: Verify go mod
        run: make go-mod-verify

      - name: Vet
        run: make vet

      - name: Test
        run: make test test-contribs RACE=1 CODECOV=1

      # binancefix's codecs are what fix2gen sbe makes of its vendored
      # schema: regenerated, nothing changes. Generation is the same on
      # every platform: checked once.
      - name: Verify binancefix's generated codecs
        if: matrix.os == 'ubuntu-24.04' && !matrix.simd
        run: make -C contribs/binancefix generate-verify

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.txt,contribs/binancefix/coverage.txt,contribs/binancemd/coverage.txt,contribs/coinbasemd/coverage.txt,contribs/fixpecho/coverage.txt,contribs/store/sqlite3/coverage.txt
          # Each platform covers code the others do not, SIMD checksums,
          # darwin's hrtimer: Codecov merges them.
          flags: ${{ runner.os }}-${{ runner.arch }}${{ matrix.simd && '-simd' || '' }}
          use_oidc: true

  fuzz:
    name: Fuzz (${{ matrix.os }}${{ matrix.simd && ', simd' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        simd: [false, true]
    env:
      GOEXPERIMENT: ${{ matrix.simd && 'simd' || '' }}
      # A quick pass on pushes and pull requests, longer every night.
      FUZZTIME: ${{ inputs.fuzztime || (github.event_name == 'schedule' && '3m') || '20s' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: |
            go.sum
            contribs/*/go.sum
            contribs/*/*/go.sum

      - name: Locate the fuzz cache
        id: gocache
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      # The inputs the fuzzers found interesting, kept from run to run.
      - name: Restore the fuzz corpus
        uses: actions/cache@v6
        with:
          path: ${{ steps.gocache.outputs.dir }}/fuzz
          key: fuzz-${{ matrix.os }}-${{ matrix.simd }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-${{ matrix.os }}-${{ matrix.simd }}-

      - name: Fuzz
        run: make fuzz FUZZTIME=$FUZZTIME

      # A failing input is written to its package's testdata/fuzz: commit it
      # as a regression seed once fixed.
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures-${{ matrix.os }}${{ matrix.simd && '-simd' || '' }}
          path: "**/testdata/fuzz/"
          if-no-files-found: ignore
